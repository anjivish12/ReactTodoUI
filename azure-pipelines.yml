- stage: SCAscan
  displayName: sca scan
  jobs:
  - job: scascanjob
    displayName: (retire.js)SCA scan
    steps:
  
    - task: PowerShell@2
      displayName: retire.js(javascript)
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          npm install
          npm install -g retire
          retire
          retire --outputformat cyclonedx