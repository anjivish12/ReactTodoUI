- stage: deploytoVM
  displayName:  deploy
  jobs:
  - deployment: deploytoVM
    displayName: deployment to VM using environment
    environment: 
      name: dev
      resourceType: virtualMachine
    strategy:                 # deployment strategy
      runOnce:              # default strategy
        deploy:
          steps:
          - task: DownloadPipelineArtifact@2
            displayName: download artifacts
            inputs:
              buildType: 'specific'
              project: '587fbf2b-269b-4579-8924-db577d7138dc'
              definition: '40'
              buildVersionToDownload: 'specific'
              pipelineId: '612'
              artifactName: 'build'
              targetPath: '/var/www/html'
        
      
          

          